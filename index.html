<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KY Nature Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05050a;
    --ink: #b026ff;
    --ink-dim: #7c85b8;
    --accent: #b026ff;
    --line: rgba(150, 165, 255, 0.16);
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .prompt {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 600;
    font-size: clamp(1.6rem, 6.5vw, 4rem);
    letter-spacing: -0.01em;
    color: var(--ink);
    text-shadow: 0 0 8px rgba(176, 38, 255, 0.85), 0 0 24px rgba(176, 38, 255, 0.6), 0 0 60px rgba(176, 38, 255, 0.4), 0 0 120px rgba(176, 38, 255, 0.25);
    user-select: none;
    pointer-events: none;
    text-align: left;
    padding: 0 1rem;
  }
  .prompt::before {
    content: "> ";
    color: var(--accent);
  }
  .cursor {
    display: inline-block;
    width: 0.5em;
    height: 0.9em;
    background: var(--accent);
    animation: blink 1.05s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; opacity: 1; }
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <p class="prompt">KY NATURE BEAUTY<span class="cursor" aria-hidden="true"></span></p>

  <script>
  (function () {
    var canvas = document.getElementById('bg');
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w, h;
    var pointer = { x: null, y: null, active: false };
    var particles = [];

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      initParticles();
    }

    function initParticles() {
      var area = w * h;
      var count = Math.round(Math.min(Math.max(area / 12000, 40), 160));
      particles = [];
      for (var i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 1.6 + 0.6
        });
      }
    }

    function setPointer(x, y, active) {
      pointer.x = x;
      pointer.y = y;
      pointer.active = active;
    }

    window.addEventListener('mousemove', function (e) {
      setPointer(e.clientX, e.clientY, true);
    }, { passive: true });

    window.addEventListener('mouseleave', function () {
      pointer.active = false;
    }, { passive: true });

    window.addEventListener('touchstart', function (e) {
      var t = e.touches[0];
      if (t) setPointer(t.clientX, t.clientY, true);
    }, { passive: true });

    window.addEventListener('touchmove', function (e) {
      var t = e.touches[0];
      if (t) setPointer(t.clientX, t.clientY, true);
    }, { passive: true });

    window.addEventListener('touchend', function () {
      pointer.active = false;
    }, { passive: true });

    window.addEventListener('resize', resize);

    var linkDist = 120;
    var pointerDist = 160;

    function step() {
      ctx.clearRect(0, 0, w, h);

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];

        if (pointer.active) {
          var dx = p.x - pointer.x;
          var dy = p.y - pointer.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < pointerDist && dist > 0.01) {
            var force = (pointerDist - dist) / pointerDist;
            p.vx += (dx / dist) * force * 0.06;
            p.vy += (dy / dist) * force * 0.06;
          }
        }

        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;

        if (p.x < 0) { p.x = 0; p.vx *= -1; }
        if (p.x > w) { p.x = w; p.vx *= -1; }
        if (p.y < 0) { p.y = 0; p.vy *= -1; }
        if (p.y > h) { p.y = h; p.vy *= -1; }
      }

      for (var a = 0; a < particles.length; a++) {
        for (var b = a + 1; b < particles.length; b++) {
          var p1 = particles[a], p2 = particles[b];
          var ddx = p1.x - p2.x;
          var ddy = p1.y - p2.y;
          var d = Math.sqrt(ddx * ddx + ddy * ddy);
          if (d < linkDist) {
            ctx.strokeStyle = 'rgba(130, 150, 255, ' + (0.15 * (1 - d / linkDist)) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      }

      for (var j = 0; j < particles.length; j++) {
        var pp = particles[j];
        ctx.beginPath();
        ctx.arc(pp.x, pp.y, pp.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(200, 210, 255, 0.8)';
        ctx.fill();
      }

      requestAnimationFrame(step);
    }

    resize();
    requestAnimationFrame(step);
  })();
  </script>
</body>
</html>
